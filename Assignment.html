<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="AssignmentPage" class="assignment-page">
<div class="container">
    <div class="main">
    <div class="main-header header-box m-b25">
        <h1>modernize</h1>
        <span>HOME EMPOWERMENT</span>
    </div>
    <div class="main-content">
        <div class="header-box m-b20">
            <h2>Enter to win 3rd generation <br> Learning Thermostat worth $249</h2>
        </div>
        <div class="content-box">
            <div class="inpt"><input type="text" placeholder="Name" name="inptname" class="form-control"></div>
            <div class="two-inpt">
                <input type="text" placeholder="City" name="inptcity" class="form-control">
                <input type="text" placeholder="State" name="inptstate" class="form-control">
            </div>
            <div class="inpt"><input type="text" name="inptphone" placeholder="(888) 888-8888" class="form-control"></div>
            <div class="inpt"><input type="text" name="inptemail" placeholder="Email Address" class="form-control"></div>
        </div> 
        <button id="btnWin"> ENTER TO WIN</button> 
    </div>
</div>
<div class="savings-box">
    <div class="icon-bg"> <h4>EVEN MORE SAVINGS</h4></div>
   
    <div class="savings-inner-box">
    <h6>ADVERTORIAL</h6>
    <p class="p-text m0 font-1">Tricks Homeowners Use to Eliminate Bills</p>
    <p class="p-text">Surging Energy Bills, Unpredictable Weather  patterns and dissatisfaction With utility companies have homeowners scrambling</p>
    <a href="https://www.google.com/" target="_blank" title="Read More">READ MORE</a>
    </div>
</div>
</div>
</div>
<script>
    const form = document.querySelector('.content-box');
    const nameInput = form.querySelector('[name="inptname"]');
    const phoneInput = form.querySelector('[name="inptphone"]');
    const emailInput = form.querySelector('[name="inptemail"]');
    const cityInput = form.querySelector('[name="inptcity"]');
    const stateInput = form.querySelector('[name="inptstate"]');
    const button = document.querySelector('#btnWin');

    function setError(input, hasError) {
        if (hasError) {
            input.classList.add('error');
            
        } else {
            input.classList.remove('error');
        }
    }

    function formatPhone(input) {
        let val = input.value.replace(/\D/g, '').substring(0, 10);
        let formatted = '';
        if (val.length > 0) formatted = '(' + val.substring(0, 3);
        if (val.length >= 4) formatted += ') ' + val.substring(3, 6);
        if (val.length >= 7) formatted += '-' + val.substring(6, 10);
        input.value = formatted;
    }

    function isValidTextField(val) {
        return /^[A-Za-z\s]{2,}$/.test(val);
    }

    phoneInput.addEventListener('input', () => formatPhone(phoneInput));

    button.addEventListener('click', async (e) => {
        e.preventDefault();

        //validation 
        const nameValidation = nameInput.value.trim().length >= 2;
        const mobileValidation = /^\(\d{3}\) \d{3}-\d{4}$/.test(phoneInput.value);
        const emailValidation = /\S+@\S+\.\S+/.test(emailInput.value);

        const cityVal = cityInput.value.trim();
        const stateVal = stateInput.value.trim();
        const cityValid = cityVal === '' || isValidTextField(cityVal); //optional input
        const stateValid = stateVal === '' || isValidTextField(stateVal);//optional input

        setError(nameInput, !nameValidation);
        setError(phoneInput, !mobileValidation);
        setError(emailInput, !emailValidation);
        setError(cityInput, !cityValid);
        setError(stateInput, !stateValid);

        if (nameValidation && mobileValidation && emailValidation && cityValid && stateValid) {
            const data = {
                name: nameInput.value.trim(),
                city: cityVal,
                state: stateVal,
                phone: phoneInput.value.trim(),
                email: emailInput.value.trim()
            };

            try {
                await fetch('https://formsws-hilstaging-com-0adj9wt8gzyq.runscope.net/solar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                alert("Form submitted successfully!");
                form.reset(); 
            } catch (error) {
                console.warn("form submission failed.");
                alert("form Submission attempted.");
            }
        }
    });
</script>

</body>
</html>
